aid: miniflux
name: Miniflux
description: Miniflux is an open-source minimalist feed reader focused on simplicity and privacy. It provides a clean web interface, supports
  self‑hosting via binary, Docker, or packages, and offers a RESTful API for managing feeds, entries, categories, and users. The project emphasizes
  readability, low resource usage, and no telemetry, making it suitable for personal and small‑team use.
